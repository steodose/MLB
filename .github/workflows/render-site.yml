name: Render and Deploy MLB Website

on:
  schedule:
    # 8 AM Pacific year-round: 15:00 UTC during PDT, 16:00 UTC during PST.
    # The "Pacific-hour gate" step below ensures only one of the two actually proceeds.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pacific-hour gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%H)
          echo "Pacific local hour: $hour"
          if [ "$hour" = "08" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up R
        if: steps.gate.outputs.proceed == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        if: steps.gate.outputs.proceed == 'true'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfreetype6-dev libpng-dev libjpeg-dev libtiff5-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libmagick++-dev

      - name: Install R dependencies
        if: steps.gate.outputs.proceed == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Skip auto-scanning the repo — old .R/.qmd files reference
          # packages (ggchicklet, ggalt) we don't need for the site render.
          packages: any::sessioninfo
          extra-packages: |
            any::rmarkdown
            any::tidyverse
            any::lubridate
            any::glue
            any::htmltools
            any::ggimage
            any::ggrepel
            any::ggforce
            any::ggsci
            any::ggtext
            any::paletteer
            any::prismatic
            any::extrafont
            any::reactable
            any::gt
            any::gtExtras
            any::baseballr
            github::timelyportfolio/dataui
            github::kcuilla/reactablefmtr
            github::beanumber/teamcolors

      - name: Render site
        if: steps.gate.outputs.proceed == 'true'
        run: Rscript -e 'rmarkdown::render_site()'

      - name: Rename MLB Summary output
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ -f "MLB Summary.html" ]; then
            mv "MLB Summary.html" "MLB-Summary.html"
          fi

      - name: Update README Last Updated date
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sed -i "s|Last Updated:.*|Last Updated: $(TZ=America/Los_Angeles date +'%B %d, %Y')|" README.md

      - name: Commit & push changes
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- '*.html' '*_files' README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated site update: $(TZ=America/Los_Angeles date +'%Y-%m-%d')"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
