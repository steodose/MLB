name: Render and Deploy MLB Website

on:
  schedule:
    # One run a day at 15:00 UTC.
    # That's 8 AM PDT (Mar–Nov) and 7 AM PST (Nov–Mar). DST drift is acceptable.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfreetype6-dev libpng-dev libjpeg-dev libtiff5-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libmagick++-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Skip auto-scanning the repo — old .R/.qmd files reference
          # packages (ggchicklet, ggalt) we don't need for the site render.
          packages: any::sessioninfo
          extra-packages: |
            any::rmarkdown
            any::tidyverse
            any::lubridate
            any::glue
            any::htmltools
            any::ggimage
            any::ggrepel
            any::ggforce
            any::ggsci
            any::ggtext
            any::paletteer
            any::prismatic
            any::extrafont
            any::reactable
            any::gt
            any::gtExtras
            any::baseballr
            github::timelyportfolio/dataui
            github::kcuilla/reactablefmtr
            github::beanumber/teamcolors

      - name: Render site
        run: Rscript -e 'rmarkdown::render_site()'

      - name: Update README Last Updated date
        run: |
          sed -i "s|Last Updated:.*|Last Updated: $(TZ=America/Los_Angeles date +'%B %d, %Y')|" README.md

      - name: Show working tree after render (debug)
        run: |
          echo "=== ls of root HTML + _files dirs ==="
          ls -la *.html 2>/dev/null || echo "(no html at root)"
          for d in *_files; do
            [ -d "$d" ] && echo "--- $d ---" && ls -la "$d"
          done
          echo "=== git status before staging ==="
          git status --short

      - name: Stage site outputs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Add HTML files explicitly (one per page, plus the renamed Summary).
          for f in index.html about.html MLB-Summary.html Teams.html Players.html; do
            if [ -f "$f" ]; then
              git add -- "$f"
              echo "staged: $f"
            else
              echo "missing: $f"
            fi
          done
          # Add each _files asset directory explicitly (handles spaces in names).
          for d in *_files; do
            if [ -d "$d" ]; then
              git add -- "$d"
              echo "staged dir: $d"
            fi
          done
          # README has the auto-updated "Last Updated" line.
          git add -- README.md
          echo "=== git status after staging ==="
          git status --short

      - name: Commit & push
        run: |
          if git diff --cached --quiet; then
            echo "No staged changes — nothing to commit."
            exit 0
          fi
          git commit -m "Automated site update: $(TZ=America/Los_Angeles date +'%Y-%m-%d')"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
