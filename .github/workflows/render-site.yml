name: Render and Deploy MLB Website

on:
  schedule:
    - cron: '0 15 * * *'  # Runs every day at 8 AM PT (adjust as needed)
  workflow_dispatch:  # Optional: allows you to manually trigger

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          R -e 'install.packages(c("rmarkdown", "tidyverse", "ggplot2", "glue", "ggimage", "baseballr", "reactable", "reactablefmtr", "ggtext", "ggrepel", "ggforce", "ggsci", "paletteer", "prismatic"))'
          # Add any other packages you need

      - name: Render site
        run: |
          R -e 'rmarkdown::render_site()'

      - name: Commit & push changes
        run: |
          git config --local user.email "[email protected]"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "Automated daily site update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
